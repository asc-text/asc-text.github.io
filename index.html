:root {
  --ink: #111111;
  --ink-soft: #55544f;
  --rule: rgba(17, 17, 17, 0.14);
  --neutral: #DDF6EE;
  --pill: rgba(224, 224, 224, 0.92);
  --mark: #FFE600;
  --field: #FFFFFF;
  --bg: var(--neutral);
  --sans: "Overused Grotesk", "ASC KR", "Apple SD Gothic Neo", "Malgun Gothic", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
html, body { height: 100%; }
body {
  background: #FFFFFF linear-gradient(180deg, var(--bg) 0%, #FFFFFF 70%, #FFFFFF 100%) fixed;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 500;
  line-height: 1.5;
  word-break: keep-all;
  padding-block: 24px 110px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
h1, h2, p { margin: 0; font-size: inherit; font-weight: inherit; }
a { color: var(--ink); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.cols { display: flex; flex-wrap: wrap; gap: 28px 0; min-height: calc(100vh - 134px); }
.col { flex: 1 1 340px; min-width: 0; box-sizing: border-box; }
.left { padding-right: 32px; }
.right { padding-left: 32px; border-left: 1px solid var(--rule); }
.rows { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 4px 0; }
.quiet { color: var(--ink-soft); }

.brand {
  display: inline-block;
  border: 0;
  background: none;
  padding: 0;
  margin: 0 0 28px;
  font-size: 28px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.01em;
  cursor: pointer;
}
.title {
  display: block;
  border: 0;
  background: none;
  padding: 0;
  margin: 0 0 4px;
  font-size: clamp(21px, 2.5vw, 27px);
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
  text-align: left;
  cursor: pointer;
}
.title[aria-pressed="true"] { background: linear-gradient(transparent 55%, var(--mark) 55%); }
.add { margin-top: 16px; }

.right .lead { max-width: 30em; margin-bottom: 28px; white-space: pre-line; }
.right .rows { margin-bottom: 28px; }
.right .summary { max-width: 30em; margin-bottom: 28px; }
.right .body { max-width: 34em; }
.right .cat { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
.right .post-title {
  font-size: clamp(21px, 2.5vw, 27px);
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
  margin: 0 0 28px;
}
.right .body p { margin: 1.2em 0 0; font-size: 17px; line-height: 1.75; }
.right .body p:first-child { margin-top: 0; }
.right .body p.indent { margin-top: 0; text-indent: 1em; }
.cats { display: flex; gap: 14px; }
.cats label { display: flex; align-items: center; gap: 6px; font-size: 16px; margin: 0; cursor: pointer; color: var(--ink); }
.right .status { font-size: 13px; color: var(--ink-soft); }

@media (max-width: 760px) {
  .cols { min-height: 0; }
  .left { padding-right: 0; }
  .right { padding-left: 0; padding-top: 24px; border-left: 0; border-top: 1px solid var(--rule); }
}

/* 수정 화면 */
.form { display: grid; gap: 14px; max-width: 34em; }
.form label, .form .label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
.form input[type="text"], .form textarea {
  width: 100%;
  box-sizing: border-box;
  font: inherit;
  color: var(--ink);
  background: var(--field);
  border: 1px solid var(--ink);
  border-radius: 0;
  padding: 6px 8px;
}
.form textarea { resize: vertical; line-height: 1.6; }
.swatches { display: flex; gap: 14px; flex-wrap: wrap; }
.swatches label { display: flex; align-items: center; gap: 6px; font-size: 16px; margin: 0; cursor: pointer; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--ink);
  border-radius: 0;
  background: none;
  padding: 5px 10px;
  cursor: pointer;
  font-size: 15px;
}
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.danger { border-color: #B3170A; color: #B3170A; }
.hint { font-size: 13px; color: var(--ink-soft); }

nav {
  position: fixed;
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  pointer-events: none;
}
nav > * { pointer-events: auto; }
nav button {
  border: 0;
  border-radius: 6px;
  background: var(--pill);
  line-height: 1;
  padding: 9px;
  cursor: pointer;
  font-size: 15px;
}
nav button.solid { background: var(--ink); color: #FFFFFF; }
nav button:disabled { opacity: 0.5; cursor: default; }
nav .msg { font-size: 13px; background: var(--pill); border-radius: 6px; padding: 6px 9px; }
nav input {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: #FFFFFF;
  border: 1px solid var(--ink);
  border-radius: 6px;
  padding: 7px 9px;
  width: 16em;
  max-width: 60vw;
}
</style>
</head>
<body>

<script type="application/json" id="data">{"info":{"name":"ASC","lead":"","place":"","instagram":""},"posts":[{"title":"Cindy Sherman","color":"#F4D044","tag":"예술","date":"","summary":"","body":"신디 셔먼(Cindy Sherman)은 뉴욕을 기반으로 활동하는 사진작가로, 연출한 상황 속에 스스로 분장한 자신을 주된 피사체로 삼는다. ≪무제 필름 스틸 Untitled Film Stills≫에서 시작된 이 방식은 1980년대 중반 이후 보형물과 인형이 등장하는 연작으로 이어진다. \n초기 연작 ≪무제 필름 스틸≫ 속 여성은 대개 화면에 없는 무언가를 바라본다. 이때 여성이 바라보는 곳과 관객이 서 있는 곳은 모두 화면 바깥이며, 화면에 담기지 않은 사진 속 세계는 여성을 '보이는 존재'로 대상화하는 관객의 현실과 동일한 층위에 놓인다. \n\t〈무제 필름 스틸 #14 Untitled Film Still #14〉(1978)에서 검은 레이스 원피스에 진주 목걸이를 한 여성은 몸을 정면에 두고 시선을 화면 밖으로 돌리고 있다. 의상에 더불어, 부풀린 단발과 짙은 아이라인 그리고 목덜미에 얹은 손은 1950-60년대 영화가 여성에게 입혀 온 외형적 클리셰다. 그 뒤 거울에는 그의 뒷모습과 함께 꽃무늬 식탁보로 덮인 탁자가 비치고 같은 식탁보가 화면 왼쪽 아래 귀퉁이에서 다시 나타나 카메라가 선 자리 역시 같은 방 안임을 알리지만 거울은 정작 그 카메라를 비추지 않는다. 그의 눈이 화면 밖의 무언가로 향하는 동안 보이지 않는 카메라가 그를 지켜보고, 관객은 그 카메라의 자리를 넘겨받아 자신을 알아채지 못하는 여성을 일방적으로 바라보는 것이다. 이처럼 화면 속 여성에 대한 시선의 비대칭이 대상화의 구조를 이룬다. 페미니즘 비평이 이 연작을 여성 재현의 문제로 읽어 온 것도 이 때문이다.\n뒤이은 ≪동화 Fairy Tales≫(1985)와 ≪재난 Disasters≫(1986-1989) 시리즈에서는 고채도의 색광에 잠긴 풍경이 등장한다. 〈무제 #153 Untitled #153〉(1985) 속 강에 휩쓸린 듯 젖은 얼굴과 옷에 흙이 묻은 인물은 이끼가 낀 검은 땅 위에 누워있다. 허공을 응시하는 그 얼굴 위로 자연광으로 설명되지 않는 보랏빛이 헝클어진 은발에서 뺨과 목을 타고 어깨까지 번진다. 화면 밖에서 비쳐 들어와 형광에 가까운 초록 이끼와 보색을 이루는 이 보랏빛은 오른쪽 모서리에서 어깨 아래가 잘려 나간 몸과 함께 나머지 풍경을 짐작하게 한다. 그 몸이 이어지는 땅 역시 같은 보라와 초록으로 물든 곳일 터다.\n\t화면 밖을 짐작하던 눈길은 첫눈에 시신의 도상을 불러내는 얼굴로 다시 돌아온다. 아래에서부터 힘이 빠졌는지 고개는 어색하게 기울었고 핏기 가신 입술은 살짝 벌어졌다. 반면 이마에만 딱 그만큼의 힘이 남아 눈썹 가운데가 살짝 들려있고 눈썹꼬리는 관자놀이 쪽으로 기울어 초점 없는 눈 위로 눈꺼풀이 반쯤 내려앉았다. 얼굴에 오래 머물다 보면 화면을 채운 빛에 작게 오므라든 동공이 보인다. 그러자 죽은 듯 누워 있던 인물은 누군가를 향해 마지막 말을 꺼내려는 것 처럼 입술을 달싹인다. 사진은 그 말이 나오기 직전의 순간을 붙든 것만 같다. 이 작은 발견은 작품에 새로운 가능성을 더한다. 빛에 반응한 눈은 카메라 앞에서 죽음을 연기한 몸을 드러내는 연출의 증거이기도 하지만 반대로 인물을 죽은 것도 산 것도 아닌 채로 남겨 비현실의 질서에 온전히 귀속시킨다. 어느 쪽이든 사진은 시신을 찍은 사진에 머물지 않는다.\n내가 보기에 셔먼의 사진은 대체로 이러하다. 옷과 가발과 화장, 장소와 그 위의 소품 혹은 자연물처럼 현실에서 빌려 온 것들에 발을 딛고 있으면서도 그것들을 연출로 엮어 현실과는 다른 미적 질서를 세운다. 동시에 이는 새로운 가능성이기도 하다. 그녀는 그 가능성을 긍정하며 사진이라는 매체를 통해 매번 다른 사람이 된다. \n\t물론 그녀를 독해하고자 하는 시도는 그리 중요하지 않을지도 모른다. 매번 다른 세계를 창조하는 솜씨와 함께 나를 그 앞에 붙잡아 두는 것은 수많은 인물의 표면 아래에서 〈무제 #153〉의 입술처럼 막 말이 되려는 무언가를 발견하는 순간이기 때문이다. 그래서인지 나는 그녀의 사진이 좋다.\n"},{"title":"바깥 없는 굴: 《김희천: 두더지들》","color":"#5E4B3C","tag":"예술","date":"","summary":"","body":"《김희천: 두더지들》은 어딘가에 구멍을 내는 장면을 거듭 배치한다. 김희천의 영상은 흔히 화면 안팎으로 갈라진 감각에 대한 보고서로 읽혀 왔고 이번 전시도 \"지표면을 잠시 이탈해 실재와 가상이 교차하는 감각적인 여정\"을 경험하도록 구성했다고 한다. 이런 독해는 대개 진짜 세계(실재)라는 바깥으로 귀환할 수 있는 출구를 암묵적으로 전제한다. 하지만 내가 보기에 그의 작품에서 바깥은 처음부터 상정되어 있지 않다. 실제로 그는 10년 전 작품, 〈바벨〉에서 세계는 스크린이 되었다고 말한 바 있다. 이러한 맥락에서 전시실을 SCREEN 1, 2, 3으로 부른다는 점도 눈에 띈다. 작가에게 세상이 이미 스크린이라면 전시장도 스크린 단위로 나누는 것이 합리적이다. 김희천은 바깥 없는 세계 한복판에 두더지를, 그것도 복수로 호출한다. 바깥이 없는 세계에서 두더지의 굴은 '안'과 '안'으로 이어진다.\n굴은 SCREEN 1의 긴 방에서 먼저 확인된다. SCREEN 1에는 방 뒤편으로 세 개의 화면이 배치되어 있고 이를 지나 앞쪽에 〈말린〉(Cured, 2026)의 화면이 자리한다. 〈말린〉은 서울시립미술관의 제작 지원으로 이번 전시에서 처음 공개된 신작이다. 작품 속 주인공인 찬종은 자연 다큐멘터리 감독으로, 신작 ‘claws’가 연출된 촬영이었다는 스캔들로 작업을 중단한다. 이후 그는 신원을 알 수 없는 수사관의 제안을 받고 한 영상이 AI로 생성된 것이 아니라 실제로 촬영된 것임을 증명하기 위해 여정을 떠난다. 여정 중에 그가 문제의 신작을 연출했다는 사실이 드러나고 후반부에 찬종은 산사태로 땅에 묻히며 두더지가 그의 몸을 찢고 안으로 파고든다.\n\t찬종이 증명해야 할 것은 카메라 앞에 무언가 실제로 있었다는 사실, 곧 '바깥'의 세계지만, 인물도 증거가 될 영상도 모두 AI에 의해 생성된 것이니 그가 증명하려는 바깥은 이 작품 어디에도 없다. 이 모순은 찬종의 방법론과도 대응한다. 그는 \"짐승의 사소한 흔적, 새소리, 나뭇잎의 상태 등을 경험의 축적이 없이도 본능으로\" 그냥 아는 감독으로 등장한다. 통계적 학습에 의해 이미지를 산출하는 AI와 정확히 정반대에 위치하는 앎이다. 이랬던 그가 신작에서는 머릿속에 그린 장면을 자연이 내주지 않자 그 장면을 연출하기 위해 수많은 두더지를 희생시킨다. 원하는 결과물을 얻기 위해 프롬프트를 수십 번 고쳐 쓰는 일과 같은 순서다. 전시는 인간이 인공지능의 작동 방식을 학습하고 내재화하는 단계에 이르렀다고 하는데 찬종의 방법론은 그 증상처럼 보인다.\n\t한 영상이 찍힌 것인지 AI로 생성된 것인지 가리는 일은 대개 보는 순간의 감각에 맡겨진다. 찬종의 방법론이 인공지능과 비슷하다는 점에서, 그에게 영상의 진위를 판별하는 일은 자기 눈이 아직 본능으로 그냥 아는 사람의 눈인지 가리는 일이기도 하다. 관객도 같은 임무를 받지만 그 방향은 찬종과 반대다. 관객은 영상의 모든 이미지가 만들어진 것임을 알지만, 영상 속 어떤 순간이 정말 현실처럼 보이면 '진짜 같다'고 느낀다. 관객은 눈앞에 있는 것이 이미 가짜임을 알기에 눈은 판별 기준이 되지 않는다. 여기서 '진짜 같다'는 말은 손을 뻗으면 만져질 듯한 감각을 의미한다. 이때 기준은 손, 곧 촉각이다. 시력이 거의 퇴화한 두더지도 촉각 수용기로 주변을 더듬어 길을 찾는다.\n\t이 촉각성이 가장 두드러지는 장면은 마지막에 두더지가 산사태에 묻힌 찬종의 몸을 찢고 파고드는 부분이다. 그리고 그 순간 관객이 느끼는 고통의 촉각적 생생함은 촉각을 가장 결여한 매체(AI)가 촉각의 동물(두더지)을 경유해 몸 내부에 도달한다는 일종의 역설에 기대고 있다. 이것을 가능하게 하는 것은 관객 역시 두더지와 같은 방식으로 길을 찾고 있다는 사실이다. 촉각으로 방향을 잡는 동물이 땅과 몸에 굴을 팔 수 있듯 같은 촉각으로 이미지를 더듬는 관객도 화면 속으로 굴을 팔 수 있다. 앞서 말했듯 김희천에게 세계는 이미 스크린이며, 바깥은 상정되어 있지 않다. 관객이 앉아 있는 곳과 화면 속 몸도 스크린의 '안'이라면 화면 속으로 굴을 파는 일은 경계를 넘을 필요도 없이 '안'에서 '안'으로 파고드는 일이 된다.\n〈더블포져〉(Double Poser, 2023)에서는 그 파고듦의 흔적이 가시화된 형태로 등장한다. SCREEN 2에 위치한 〈더블포져〉는 영국 헤이워드 갤러리와 아트선재센터의 제작 지원으로 만들어진 작품으로, 게임엔진 유니티로 제작한 38분 길이의 자동 재생 게임이다. 작품에는 허구의 컬트 집단인 스케이터들이 매일 밤 수행하는 '더블'이라는 의식이 등장한다. 이 의식은 어두운 공간을 보드로 질주하는 몸의 감각과 핸드폰을 확인하는 손의 감각이 부딪치는 순간 게임 속으로 들어가 두 겹의 존재가 되는 것을 의미한다. 영상에는 한 인물이 급히 핸드폰을 꺼내다 넘어지고 화면만 보며 보드를 타던 인물이 다치는 장면이 등장한다. 그 뒤 그룹의 필르머(filmer) L이 '더블'을 시도해 헤이워드 갤러리를 배경으로 하는 게임 세계에 도착하면서 화면은 3인칭 게임으로 넘어간다. 게임 속에는 3년 동안 갤러리의 직원이자 스케이터로 위장해 온 스파이 Lee가 있다. 그는 자신의 손 때문에 위장 신분이 발각될 위기에 처하자 그 손을 이중 스파이로 지목하고 잘라 낸다.\n\t게임이 진행되는 동안 화면 중앙 하단에 파란 형태의 두 손이 보인다. 게임이라는 형식에서 우리는 보통 컨트롤러를 두 손으로 쥐고 그 입력으로 화면 속 공간을 헤쳐 나간다. 이 작품에서도 관객의 손은 화면에 파고들어 가상의 컨트롤러를 통해 화면 속 공간을 헤쳐 나간다. 역시 손을 움직여 길을 낸다는 점에서 두더지의 문법을 충실히 이행하고 있다. 화면 우측 상단에 떠 있는 행동 강령도 이를 명시한다(“For the rest, behave as a ‘mole’”). 〈말린〉에서는 이미지가 진짜 같다는 감각이 관객으로 하여금 화면 깊숙이 굴을 파도록 유도했다면 〈더블포져〉의 굴은 그보다 얕다. 이 작품의 이미지가 그런 촉각성을 전달하지 않기 때문이다. 몸이 따라 들어갈 만큼 실감 나는 표면이 없는 곳에서 굴은 그 손의 깊이만큼만 파인다. 이렇게 손과 몸이 나뉘는 상황은 작품 앞부분에서 다루는 것이기도 하다. 화면 앞의 관객도 같은 방식으로 갈라져 손은 화면 '안'에, 몸은 SCREEN 2라는 또 하나의 '안'에 남아 '더블'된다. Lee가 자신의 손을 이중 스파이로 지목했듯 화면 안으로 파고 들어간 손은 굴을 파는 두더지의 손이면서 화면에 심어진 스파이다.\n\t〈말린〉에서 보았듯 생성형 이미지가 범람할수록 눈은 그 진위를 가려내지 못하는 순간에 이르고 판별은 결국 촉각에 기대게 된다. 영상의 진위를 미리 알지 못할 때 그 촉각성이 느껴지는 영상은 그것만으로 진짜 영상이 되기도 한다. 다시 말해, 우리는 앞으로 손으로 이미지를 더듬으면서 그것의 진위를 판별하게 되겠지만 바로 그 손이 가짜 영상을 진짜로 만들기도 한다는 것이다. 화면 안으로 들어간 손은 결국 화면 안에 종사한다는 점에서 언제든 우리를 속일 수 있는 이중 스파이다. 그렇기에 더더욱 Lee는 자신의 손을 잘라 내고 싶었을 것이다. 작품이 2023년에 만들어졌다는 점을 생각하면 Lee의 판단도 이해가 된다. 그때만 해도 생성형 이미지들이 진위의 문제를 벗어나 얼마나 '진짜'가 될 수 있는지에 대해 누구도 알기 어려웠다.\n\t〈말린〉에서 관객의 두더지-수행이 감각 안에 숨어 있었다면 〈더블포져〉는 그것을 화면 위의 손으로 가시화하여 관객이 두더지라는 사실을 노골적으로 드러낸다. 관객이 두더지라면 관객이 있는 곳은 그림 앞이 아니라 굴 안이다. 그림 앞의 관객은 거리를 두고 바깥에서 응시하지만 두더지에게는 바깥이 없다. 바깥이 상정되지 않은 세계에서 우리가 이미지와 관계 맺는 방식도 이와 같다. 우리는 촉각으로 방향을 잡고 손으로 화면 속에 굴을 판다.\nSCREEN 2에 위치한 〈커터3〉와 〈더블포져〉 사이에는 〈레몬〉(Lemon, 2026)이 있다. 〈레몬〉은 〈커터3〉와 〈더블포져〉에 두더지가 등장했었다는 사실에서 출발했다. 〈말린〉과 마찬가지로 서울시립미술관의 제작 지원으로 이번 전시에서 처음 공개된 신작이고 게임엔진 유니티로 제작한 자동 재생 게임이다. 작품은 두더지 '버터'를 주인공으로 한 가상의 비디오 게임 '버터3'의 플레이로 전개된다. 버터는 나무에서 떨어진 레몬을 자신과 같은 존재로 믿고 땅속으로 데려가 돌보지만 레몬은 시간이 지나 썩어 사라진다.\n\t〈레몬〉은 〈커터3〉와 〈더블포져〉, 그리고 다른 작품에도 등장하는 두더지를 전면에 내세워 그것이 굴을 파고 있는 장면을 직접적으로 드러낸다. 〈레몬〉의 화면은 두 작품 사이, 그보다 낮은 아래쪽에 놓여 있는데 이 배치는 두더지가 굴을 통해 〈커터3〉와 〈더블포져〉를 횡단하고 있음을 암시한다. 애초에 작품이 다른 작품들에 두더지가 등장한다는 사실에서 출발했다는 점에서 더욱 그렇다. 그러나 이 굴은 단순히 두 작품 사이의 굴만을 가리키지 않는다. 전시장 안에서도 두더지'들'의 두더지-수행은 끊임없이 이어지고 있으며 〈레몬〉은 수많은 굴 중 단 하나만을 대표격으로 보여 준다.\n몸을 찢고 파고드는 두더지, 이중 스파이가 된 손, 썩어 사라진 레몬을 두고 다시 땅을 파는 버터, 그리고 스크린 사이를 오가며 화면 속으로 굴을 파는 관객. 이들은 각자의 굴을 파는 동시에 서로의 굴을 관통한다. 전시 제목이 두더지가 아닌 두더지'들'인 까닭이다.\n"}]}</script>
<script id="appjs">
(function () {
  var HEX = { red: '#D9200F', blue: '#1F3FE0', green: '#0A7D3B' };
  var COLOR_LABEL = { red: '빨강', blue: '파랑', green: '초록' };
  function isHex(c) { return /^#[0-9a-fA-F]{6}$/.test(c); }
  function colorOf(c) { return HEX[c] || (isHex(c) ? c : HEX.red); }
  // 밝은 색 제목은 노란 형광펜 대신 옅은 회색으로 표시한다.
  function isLight(hex) {
    var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 170;
  }
  function markOf(c) { return 'rgba(17,17,17,0.08)'; }

  // 페이지의 고정된 원본(스타일·스크립트). 저장할 때 내용만 바꿔 다시 조립한다.
  var CSS_SRC = document.getElementById('css').textContent;
  var JS_SRC = document.getElementById('appjs').textContent;

  function str(v) { return typeof v === 'string' ? v : ''; }
  function normalize(d) {
    d = d && typeof d === 'object' ? d : {};
    var i = d.info && typeof d.info === 'object' ? d.info : {};
    var posts = Array.isArray(d.posts) ? d.posts : [];
    return {
      info: {
        name: str(i.name) || 'ASC',
        lead: str(i.lead),
        place: str(i.place),
        instagram: str(i.instagram)
      },
      posts: posts.map(function (p) {
        p = p || {};
        return {
          title: str(p.title), color: (HEX[p.color] || isHex(p.color)) ? p.color : 'red', tag: p.tag === '사회' ? '사회' : '예술',
          date: str(p.date), summary: str(p.summary), body: str(p.body)
        };
      })
    };
  }
  function clone(d) { return JSON.parse(JSON.stringify(d)); }

  var data;
  try { data = normalize(JSON.parse(document.getElementById('data').textContent)); }
  catch (e) { data = normalize(null); }

  // sel: -1 이면 사이트 소개, 0 이상이면 그 글
  var ui = { sel: -1, editing: false, canEdit: false, saving: false, msg: '', confirmDelete: false };
  var draft = null;
  var artifact = null;
  var app = document.getElementById('app');
  var nav = document.getElementById('nav');
  var root = document.documentElement;

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'text') n.textContent = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else if (k === 'value') n.value = v;
      else if (k === 'checked' || k === 'disabled') n[k] = !!v;
      else n.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function cur() { return ui.editing ? draft : data; }
  function pick(i) { ui.sel = i; ui.confirmDelete = false; render(); }

  function field(id, label, value, onInput, opts) {
    opts = opts || {};
    var input = opts.rows
      ? el('textarea', { id: id, rows: String(opts.rows), value: value, placeholder: opts.placeholder })
      : el('input', { id: id, type: 'text', value: value, placeholder: opts.placeholder });
    input.addEventListener('input', function () { onInput(input.value); });
    return el('div', null, [el('label', { 'for': id, text: label }), input]);
  }

  /* ---------- 왼쪽: ASC + 제목 목록 ---------- */
  function leftCol(d) {
    var kids = [el('h1', null, [el('button', {
      type: 'button', 'class': 'brand', 'aria-pressed': String(ui.sel === -1),
      text: d.info.name || 'ASC', onclick: function () { pick(-1); }
    })])];
    d.posts.forEach(function (p, idx) {
      kids.push(el('button', {
        type: 'button', 'class': 'title', style: 'color:' + colorOf(p.color) + ';--mark:' + markOf(p.color),
        'aria-pressed': String(idx === ui.sel), text: p.title || '(제목 없음)',
        onclick: function () { pick(idx); }
      }));
    });
    if (!d.posts.length) kids.push(el('p', { 'class': 'quiet', text: '아직 글이 없습니다.' }));
    if (ui.editing) kids.push(el('button', {
      type: 'button', 'class': 'btn add', text: '+ 새 글',
      onclick: function () {
        d.posts.push({ title: '', color: 'red', tag: '예술', date: '', summary: '', body: '' });
        pick(d.posts.length - 1);
        var t = document.getElementById('f-title'); if (t) t.focus();
      }
    }));
    return el('section', { 'class': 'col left', 'aria-label': '글 목록' }, kids);
  }

  /* ---------- 오른쪽: information 칸 ---------- */
  function viewSite(i) {
    var link = /^https:\/\//.test(i.instagram)
      ? el('a', { href: i.instagram, target: '_blank', rel: 'noopener', text: 'Instagram' })
      : null;
    var kids = [];
    if (i.lead) kids.push(el('p', { 'class': 'lead', text: i.lead }));
    if (i.place || link) kids.push(el('div', { 'class': 'rows' }, [el('div', { text: i.place }), el('div', null, [link])]));
    if (!kids.length) kids.push(el('p', { 'class': 'quiet', text: '소개가 아직 없습니다.' }));
    return kids;
  }
  function viewPost(p) {
    var paras = p.body.split('\n').filter(function (s) { return s.trim(); }).map(function (s) {
      return el('p', { 'class': /^[\t ]/.test(s) ? 'indent' : null, text: s.trim() });
    });
    return [
      el('div', { 'class': 'cat', text: p.tag }),
      el('h2', { 'class': 'post-title', style: 'color:' + colorOf(p.color), text: p.title }),
      p.summary ? el('p', { 'class': 'summary', text: p.summary }) : null,
      paras.length
        ? el('div', { 'class': 'body' }, paras)
        : el('p', { 'class': 'status', text: '본문 준비 중' })
    ];
  }
  function editSite(i) {
    return [el('div', { 'class': 'form' }, [
      field('f-name', '이름', i.name, function (v) {
        i.name = v;
        var b = app.querySelector('.brand'); if (b) b.textContent = v || 'ASC';
      }),
      field('f-lead', '소개 (줄바꿈 그대로 보임)', i.lead, function (v) { i.lead = v; }, { rows: 6 }),
      field('f-place', '지역', i.place, function (v) { i.place = v; }),
      field('f-insta', '인스타그램 주소', i.instagram, function (v) { i.instagram = v.trim(); }, { placeholder: 'https://instagram.com/계정' }),
      el('p', { 'class': 'hint', text: '글을 고치려면 왼쪽 제목을 누르세요.' })
    ])];
  }
  function editPost(d, p) {
    var idx = ui.sel;
    function move(delta) {
      var j = idx + delta;
      if (j < 0 || j >= d.posts.length) return;
      d.posts.splice(j, 0, d.posts.splice(idx, 1)[0]);
      pick(j);
    }
    var swatches = el('div', { 'class': 'swatches' }, Object.keys(HEX).map(function (c) {
      var r = el('input', { type: 'radio', name: 'f-color', id: 'f-color-' + c, checked: p.color === c });
      r.addEventListener('change', function () { p.color = c; render(); });
      return el('label', { 'for': 'f-color-' + c, style: 'color:' + HEX[c] }, [r, el('span', { text: COLOR_LABEL[c] })]);
    }));
    var del = ui.confirmDelete
      ? el('button', { type: 'button', 'class': 'btn danger', text: '정말 삭제', onclick: function () {
          d.posts.splice(idx, 1); ui.confirmDelete = false; pick(d.posts.length ? Math.max(0, idx - 1) : -1);
        } })
      : el('button', { type: 'button', 'class': 'btn danger', text: '이 글 삭제', onclick: function () {
          ui.confirmDelete = true; render();
        } });
    return [el('div', { 'class': 'form' }, [
      field('f-title', '제목', p.title, function (v) {
        p.title = v;
        var b = app.querySelectorAll('.title')[idx];
        if (b) b.textContent = v || '(제목 없음)';
      }),
      el('div', null, [el('div', { 'class': 'label', text: '제목 색' }), swatches]),
      field('f-hex', '또는 색 코드 직접 쓰기 (예: #F4D044)', isHex(p.color) ? p.color : '', function (v) {
        v = v.trim();
        if (!isHex(v)) return;
        p.color = v;
        var b = app.querySelectorAll('.title')[idx];
        if (b) { b.style.color = v; b.style.setProperty('--mark', markOf(v)); }
        root.style.setProperty('--bg', 'color-mix(in srgb, ' + v + ' 13%, #FFFFFF)');
        Array.prototype.forEach.call(app.querySelectorAll('input[name="f-color"]'), function (r) { r.checked = false; });
      }, { placeholder: '#000000' }),
      el('div', null, [el('div', { 'class': 'label', text: '분류' }), el('div', { 'class': 'cats' }, ['예술', '사회'].map(function (c, k) {
        var r = el('input', { type: 'radio', name: 'f-cat', id: 'f-cat-' + k, checked: p.tag === c });
        r.addEventListener('change', function () { p.tag = c; });
        return el('label', { 'for': 'f-cat-' + k }, [r, el('span', { text: c })]);
      }))]),
      field('f-summary', '한 줄 소개', p.summary, function (v) { p.summary = v; }, { rows: 2 }),
      field('f-body', '본문 (줄바꿈 = 새 문단, 탭이나 띄어쓰기로 시작 = 들여쓰기)', p.body, function (v) { p.body = v; }, { rows: 16 }),
      el('div', { 'class': 'tools' }, [
        el('button', { type: 'button', 'class': 'btn', text: '위로', disabled: idx === 0, onclick: function () { move(-1); } }),
        el('button', { type: 'button', 'class': 'btn', text: '아래로', disabled: idx === d.posts.length - 1, onclick: function () { move(1); } }),
        del,
        ui.confirmDelete ? el('button', { type: 'button', 'class': 'btn', text: '삭제 취소', onclick: function () { ui.confirmDelete = false; render(); } }) : null
      ])
    ])];
  }

  /* ---------- 화면 ---------- */
  function render() {
    var d = cur();
    if (ui.sel >= d.posts.length) ui.sel = d.posts.length - 1;
    var p = ui.sel >= 0 ? d.posts[ui.sel] : null;
    var rightKids = p
      ? (ui.editing ? editPost(d, p) : viewPost(p))
      : (ui.editing ? editSite(d.info) : viewSite(d.info));
    var main = el('main', { 'class': 'cols' }, [
      leftCol(d),
      el('section', { 'class': 'col right', 'aria-label': 'Information', 'aria-live': 'polite' }, rightKids)
    ]);
    if (p) root.style.setProperty('--bg', 'color-mix(in srgb, ' + colorOf(p.color) + ' 13%, #FFFFFF)');
    else root.style.removeProperty('--bg');
    app.textContent = '';
    app.appendChild(main);
    renderNav();
  }

  /* ---------- 수정 버튼 (토큰이 있는 브라우저에만 보임) ---------- */
  var REPO = 'asc-text/asc-text.github.io', FILE = 'index.html', BRANCH = 'main';
  var TOKEN_KEY = 'asc-github-token';
  function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
  function setToken(t) { try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

  function renderNav() {
    var kids = [];
    if (ui.askToken) {
      var inp = el('input', { type: 'password', id: 'f-token', placeholder: 'GitHub 토큰', autocomplete: 'off', 'aria-label': 'GitHub 토큰' });
      kids.push(inp);
      kids.push(el('button', { type: 'button', 'class': 'solid', text: '확인', onclick: function () {
        var v = inp.value.trim();
        if (!v) { ui.msg = '토큰을 넣어 주세요.'; renderNav(); return; }
        setToken(v); ui.askToken = false; ui.canEdit = true; ui.msg = ''; renderNav();
      } }));
      kids.push(el('button', { type: 'button', text: '닫기', onclick: function () { ui.askToken = false; ui.msg = ''; renderNav(); } }));
    } else if (ui.canEdit && !ui.editing) {
      kids.push(el('button', { type: 'button', text: '수정', onclick: startEdit }));
      kids.push(el('button', { type: 'button', text: '나가기', onclick: function () { setToken(''); ui.canEdit = false; ui.msg = ''; renderNav(); } }));
    }
    if (ui.editing) {
      kids.push(el('button', { type: 'button', 'class': 'solid', text: ui.saving ? '저장 중…' : '저장', disabled: ui.saving, onclick: save }));
      kids.push(el('button', { type: 'button', text: '취소', disabled: ui.saving, onclick: cancelEdit }));
    }
    if (ui.msg) kids.push(el('span', { 'class': 'msg', role: 'status', text: ui.msg }));
    nav.textContent = '';
    kids.forEach(function (k) { nav.appendChild(k); });
  }

  function startEdit() { draft = clone(data); ui.editing = true; ui.msg = ''; ui.confirmDelete = false; render(); }
  function cancelEdit() { draft = null; ui.editing = false; ui.msg = ''; ui.confirmDelete = false; render(); }

  function buildDoc(d) {
    var json = JSON.stringify(normalize(d)).replace(/</g, '\\u003c');
    return '<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
      '<title>ASC</title>\n' +
      '<style id="css">' + CSS_SRC + '<\/style>\n</head>\n<body>\n' +
      '<div id="app"></div>\n' +
      '<nav id="nav" aria-label="수정"></nav>\n' +
      '<script type="application/json" id="data">' + json + '<\/script>\n' +
      '<script id="appjs">' + JS_SRC + '<\/script>\n' +
      '</body>\n</html>\n';
  }
  function b64(str) {
    var bytes = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function api(path, opts) {
    opts = opts || {};
    opts.headers = { 'Authorization': 'Bearer ' + getToken(), 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    return fetch('https://api.github.com/repos/' + REPO + path, opts);
  }
  function save() {
    if (ui.saving) return;
    ui.saving = true; ui.msg = ''; renderNav();
    var doc = buildDoc(draft);
    api('/contents/' + FILE + '?ref=' + BRANCH, { cache: 'no-store' }).then(function (r) {
      if (r.status === 401 || r.status === 403 || r.status === 404) throw { code: 'auth' };
      if (!r.ok) throw { code: 'net' };
      return r.json();
    }).then(function (cur) {
      return api('/contents/' + FILE, { method: 'PUT', body: JSON.stringify({ message: '글 수정', content: b64(doc), sha: cur.sha, branch: BRANCH }) });
    }).then(function (r) {
      if (r.status === 401 || r.status === 403 || r.status === 404) throw { code: 'auth' };
      if (r.status === 409) throw { code: 'conflict' };
      if (!r.ok) throw { code: 'net' };
      data = normalize(draft); draft = null; ui.editing = false; ui.saving = false;
      ui.msg = '저장됨. 1분쯤 뒤 사이트에 반영돼요.'; render();
    }).catch(function (e) {
      var c = e && e.code;
      ui.saving = false;
      if (c === 'auth') {
        setToken(''); ui.askToken = true;
        ui.msg = '토큰이 맞지 않거나 권한이 없어요. 쓰던 내용은 그대로 있으니 토큰을 다시 넣고 저장해 주세요.';
      } else if (c === 'conflict') {
        ui.msg = '다른 곳에서 먼저 저장됐어요. 잠시 뒤 다시 저장해 주세요.';
      } else {
        ui.msg = '저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
      }
      renderNav();
    });
  }

  // 주소 끝에 #edit 를 붙여 열면 토큰을 넣는 칸이 나온다. 한 번 넣으면 이 브라우저에서는 수정 버튼이 계속 보인다.
  if (getToken()) ui.canEdit = true;
  else if (location.hash === '#edit') ui.askToken = true;
  render();
})();
</script>
</body>
</html>
